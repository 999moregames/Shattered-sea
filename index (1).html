<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1824">
<title>Empires of the Shattered Sea</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08131d;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:14px 16px;background:#102333;border-bottom:1px solid #28485e;position:sticky;top:0;z-index:3}
h1{font-size:20px;margin:0 0 4px}small{color:#a9bfd0}
.wrap{max-width:900px;margin:auto;padding:12px}.resources{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.res,.card{background:#112535;border:1px solid #27475c;border-radius:12px;padding:10px}.res b{display:block;font-size:16px}.res span{font-size:12px;color:#a9bfd0}
.map{height:300px;border-radius:16px;border:1px solid #31566b;position:relative;overflow:hidden;background:
radial-gradient(circle at 20% 30%,#5c8c68 0 12%,transparent 13%),
radial-gradient(circle at 78% 65%,#6e9b72 0 10%,transparent 11%),
radial-gradient(circle at 52% 42%,#557e60 0 18%,transparent 19%),
linear-gradient(135deg,#176080,#0c4962 45%,#17637b)}
.island{position:absolute;inset:12% 23%;background:#8aa56d;border-radius:45% 55% 48% 52%;transform:rotate(-8deg);box-shadow:0 10px 25px #062c3b}
.city{position:absolute;left:44%;top:42%;font-size:42px}.port{position:absolute;right:22%;bottom:24%;font-size:28px}
.panel{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
button{width:100%;padding:11px;border:1px solid #416a82;border-radius:9px;background:#1a3b50;color:#fff;font-weight:600}
button:active{transform:scale(.98)}button:disabled{opacity:.45}
.log{min-height:42px;color:#b9d0df;font-size:13px;margin-top:8px}
@media(max-width:520px){.resources{grid-template-columns:repeat(2,1fr)}.panel{grid-template-columns:1fr}.map{height:270px}}
</style>
</head>
<body>
<header><h1>⚔️ Empires of the Shattered Sea</h1><small>Island of Asteria · Prototype</small></header>
<div class="wrap">
<div class="resources">
<div class="res">🌾 <b id="food">500</b><span>Food</span></div>
<div class="res">🪵 <b id="wood">500</b><span>Wood</span></div>
<div class="res">🪨 <b id="stone">500</b><span>Stone</span></div>
<div class="res">✨ <b id="favor">0</b><span>Divine Favor</span></div>
</div>
<div class="map"><div class="island"></div><div class="city">🏛️</div><div class="port">⚓</div></div>

<div class="card" style="margin-top:10px">
<h2 style="margin:0 0 8px">🏛️ Town Center</h2>
<div>Temple Level: <b id="temple">1</b> / 25</div>
<div style="margin-top:8px">Population: <b id="pop">20</b> / <span id="cap">50</span></div>
</div>

<div class="panel">
<div class="card"><h3>Buildings</h3>
<button onclick="upgrade('farm')">🌾 Upgrade Farm (100 wood)</button>
<button onclick="upgrade('barracks')">⚔️ Upgrade Barracks (150 stone)</button>
<button onclick="upgrade('temple')">🏛️ Upgrade Temple (200 stone + 100 favor)</button>
</div>
<div class="card"><h3>Army</h3>
<button onclick="train('Hoplite',50,0)">🛡️ Train Hoplite · 50 food</button>
<button onclick="train('Swordsman',60,20)">⚔️ Train Swordsman · 60 food + 20 wood</button>
<button onclick="train('Archer',40,40)">🏹 Train Archer · 40 food + 40 wood</button>
</div>
<div class="card"><h3>Temple</h3>
<button onclick="pray()">🙏 Pray for Divine Favor</button>
<button onclick="dungeon()">🗿 Clear Dungeon</button>
</div>
<div class="card"><h3>Sea</h3>
<button onclick="explore()">⛵ Explore the Sea</button>
<button onclick="saveGame()">💾 Save Game</button>
<button onclick="resetGame()">↻ Reset Game</button>
</div>
</div>
<div class="card log" id="log">Welcome, Governor. Build your island empire.</div>
</div>
<script>
const key='shatteredSeaSimple';
let s=JSON.parse(localStorage.getItem(key)||'null')||{food:500,wood:500,stone:500,favor:0,temple:1,pop:20,cap:50,army:0};
function render(){for(const k of ['food','wood','stone','favor','temple','pop','cap'])document.getElementById(k).textContent=s[k];}
function msg(x){document.getElementById('log').textContent=x}
function saveGame(){localStorage.setItem(key,JSON.stringify(s));msg('Game saved on this device.')}
function spend(a){for(const k in a){if((s[k]||0)<a[k])return false}for(const k in a)s[k]-=a[k];return true}
function upgrade(type){
 if(type==='farm'&&spend({wood:100})){s.cap+=10;msg('Farm upgraded. Population capacity increased.')}
 else if(type==='barracks'&&spend({stone:150})){msg('Barracks upgraded. More troops can be trained.')}
 else if(type==='temple'&&s.temple<25&&spend({stone:200,favor:100})){s.temple++;msg('Temple upgraded to level '+s.temple+'.')}
 else msg('Not enough resources, or the building is already at its limit.');
 saveGame();render()
}
function train(name,food,wood){if(s.pop>=s.cap)return msg('No population space. Upgrade your farm.');if(spend({food,wood})){s.pop++;s.army++;msg(name+' trained successfully. Total army: '+s.army);saveGame();render()}else msg('Not enough resources.')}
function pray(){s.favor+=10;msg('Your people prayed. +10 Divine Favor.');saveGame();render()}
function dungeon(){if(s.temple<2)return msg('The dungeon requires Temple Level 2.');s.favor+=25;s.food+=50;msg('Dungeon cleared! Chooseable-style reward: +25 Divine Favor and +50 Food.');saveGame();render()}
function explore(){s.wood+=75;s.stone+=50;msg('Exploration complete. +75 Wood and +50 Stone.');saveGame();render()}
function resetGame(){if(confirm('Reset your local game?')){localStorage.removeItem(key);location.reload()}}
render();
setInterval(()=>{s.food+=2;s.wood+=1;s.stone+=1;render();localStorage.setItem(key,JSON.stringify(s))},5000);
</script>
</body>
</html>
