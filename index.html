<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empires of the Shattered Sea — Prototype</title>
<style>
:root{--bg:#0d1720;--panel:#14232e;--panel2:#1a2d39;--line:#31505f;--gold:#e7b85c;--text:#e8f0f2;--muted:#9fb3bd;--good:#6dd6a0;--danger:#ef7b7b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0b151d,#10212b);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#0d1b24;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0;color:var(--gold)}h2{font-size:17px;margin:0 0 12px}.sub{font-size:12px;color:var(--muted)}
button{background:#203946;color:var(--text);border:1px solid #426171;border-radius:7px;padding:9px 11px;cursor:pointer}
button:hover{border-color:var(--gold);color:white}button:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:1.25fr .95fr;gap:14px;padding:14px;max-width:1300px;margin:auto}
.card{background:linear-gradient(145deg,var(--panel),#10202a);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 8px 30px #0003}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#0e1b24;border:1px solid #274451;border-radius:8px;padding:10px}.stat b{display:block;font-size:17px;color:var(--gold)}
.map{height:440px;position:relative;overflow:hidden;border-radius:10px;background:
radial-gradient(circle at 18% 25%,#6d9366 0 5%,transparent 5.5%),
radial-gradient(circle at 75% 28%,#638d5c 0 6%,transparent 6.5%),
radial-gradient(circle at 48% 66%,#73965e 0 8%,transparent 8.5%),
linear-gradient(135deg,#17657a,#0c4e68 55%,#123e58)}
.map:before{content:"";position:absolute;inset:-30px;background:
radial-gradient(ellipse at 50% 50%,#75a064 0 22%,transparent 22.5%),
radial-gradient(ellipse at 20% 70%,#6b935d 0 13%,transparent 13.5%),
radial-gradient(ellipse at 80% 72%,#719b63 0 16%,transparent 16.5%);filter:drop-shadow(0 7px 4px #0018)}
.island{position:absolute;background:#759b63;border:3px solid #a6bb77;box-shadow:0 8px 12px #0017;border-radius:48% 52% 45% 55%;display:flex;align-items:center;justify-content:center;color:#17251a;font-weight:700}
.i1{width:260px;height:170px;left:29%;top:25%;transform:rotate(-8deg)}.i2{width:130px;height:85px;left:8%;top:12%;transform:rotate(15deg)}.i3{width:145px;height:95px;right:7%;bottom:15%;transform:rotate(-20deg)}
.node{position:absolute;background:#172b35;border:2px solid var(--gold);border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 8px #0008}.label{position:absolute;font-size:11px;background:#0b171eDD;padding:3px 6px;border-radius:4px;white-space:nowrap}
.npc{left:47%;top:38%}.mine{left:30%;top:28%}.ruin{left:58%;top:29%}.town{left:41%;top:59%}.port{left:62%;top:55%}.dungeon{left:35%;top:72%}
.panelgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px;background:#0e1c25;border:1px solid #274451;border-radius:8px}.row small{color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tab.active{border-color:var(--gold);color:var(--gold)}
#log{height:160px;overflow:auto;font-size:12px;color:#bfd0d7;line-height:1.5;background:#0b161e;padding:9px;border-radius:7px}
.progress{height:7px;background:#081218;border-radius:5px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:var(--gold)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.map{height:360px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div><h1>⚓ Empires of the Shattered Sea</h1><div class="sub">Playable prototype • Living World strategy</div></div><div><button onclick="saveGame()">Save</button> <button onclick="resetGame()">New World</button></div></header>
<main class="layout">
<section>
<div class="stats">
<div class="stat">Food<b id="food">0</b><span class="sub">+<span id="foodRate">0</span>/min</span></div>
<div class="stat">Wood<b id="wood">0</b><span class="sub">+<span id="woodRate">0</span>/min</span></div>
<div class="stat">Stone<b id="stone">0</b><span class="sub">+<span id="stoneRate">0</span>/min</span></div>
<div class="stat">Relics<b id="relic">0</b><span class="sub">World-changing currency</span></div>
</div>
<div class="card">
<h2>The Shattered Sea</h2>
<div class="map">
<div class="island i1">Your Island</div><div class="island i2"></div><div class="island i3"></div>
<div class="node npc">🏰<span class="label" style="top:44px">Neutral Fortress</span></div>
<div class="node mine">⛏️<span class="label" style="top:44px">Ancient Mine</span></div>
<div class="node ruin">🏛️<span class="label" style="top:44px">Lost Ruin</span></div>
<div class="node town">🏘️<span class="label" style="top:44px">Your Town</span></div>
<div class="node port">⚓<span class="label" style="top:44px">Harbor</span></div>
<div class="node dungeon">🗿<span class="label" style="top:44px">Deep Ruins</span></div>
</div>
</div>
<div class="card" style="margin-top:14px">
<h2>World Chronicle</h2><div id="log"></div>
</div>
</section>
<section>
<div class="card">
<div class="tabs">
<button class="tab active" onclick="showTab('city',this)">City</button><button class="tab" onclick="showTab('research',this)">Research</button><button class="tab" onclick="showTab('army',this)">Army</button><button class="tab" onclick="showTab('explore',this)">Explore</button>
</div>
<div id="content"></div>
</div>
</section>
</main>
<script>
const base={food:700,wood:700,stone:500,relic:0,build:{center:1,farm:1,lumber:1,quarry:1,barracks:1,harbor:1,wall:1},research:{logistics:0,steel:0,seafaring:0},army:{spears:20,swords:0,archers:0,raiders:0,ships:0},discoveries:0,explored:0,worldAge:1};
let g=JSON.parse(localStorage.getItem('sss'))||base;
let tab='city', timer=null, last=Date.now();
function saveGame(){localStorage.setItem('sss',JSON.stringify(g));log('Game saved.');}
function resetGame(){if(confirm('Start a new world?')){localStorage.removeItem('sss');location.reload()}}
function n(x){return Math.floor(x).toLocaleString()}
function cost(type,lvl){let b={center:[180,220,160],farm:[80,100,60],lumber:[90,70,50],quarry:[90,70,90],barracks:[160,130,120],harbor:[220,170,220],wall:[180,100,260]}[type];let m=Math.pow(1.42,lvl-1);return {food:Math.round(b[0]*m),wood:Math.round(b[1]*m),stone:Math.round(b[2]*m)}}
function can(c){return g.food>=c.food&&g.wood>=c.wood&&g.stone>=c.stone}
function spend(c){g.food-=c.food;g.wood-=c.wood;g.stone-=c.stone}
function upgrade(type){let lvl=g.build[type];if(lvl>=({center:15,farm:20,lumber:20,quarry:20,barracks:15,harbor:15,wall:12}[type]))return log('That building has reached the prototype cap.');let c=cost(type,lvl);if(!can(c))return log('Not enough resources.');spend(c);g.build[type]++;log(`${name(type)} reached level ${g.build[type]}.`);render()}
function name(x){return {center:'Town Center',farm:'Farm',lumber:'Lumber Camp',quarry:'Quarry',barracks:'Barracks',harbor:'Harbor',wall:'City Wall'}[x]}
function rates(){return {food:1.5+g.build.farm*2.1,wood:1.3+g.build.lumber*1.8,stone:1.0+g.build.quarry*1.65}}
function train(unit){let c={spears:{food:25,wood:5,stone:0},swords:{food:45,wood:15,stone:5},archers:{food:35,wood:30,stone:0},raiders:{food:65,wood:45,stone:10},ships:{food:120,wood:180,stone:20}}[unit];if(!c)return;if(g.build.barracks<({spears:1,swords:3,archers:4,raiders:7}[unit]||99))return log('Research this unit first.');if(!can(c))return log('Not enough resources.');spend(c);g.army[unit]++;log(`${unitName(unit)} recruited.`);render()}
function unitName(x){return {spears:'Spearmen',swords:'Swordsmen',archers:'Archers',raiders:'Sea Raiders',ships:'Warship'}[x]}
function research(x){let req={logistics:['Logistics',1,250,180,120],steel:['Steelcraft',3,450,320,240],seafaring:['Seafaring',2,350,500,300]}[x];if(g.research[x]>=3)return log('Research branch complete.');if(g.build.center<req[1]+1)return log(`Town Center level ${req[1]+1} required.`);let c={food:req[2],wood:req[3],stone:req[4]};if(!can(c))return log('Not enough resources.');spend(c);g.research[x]++;log(`${req[0]} advanced to level ${g.research[x]}.`);render()}
function explore(){if(g.army.spears+g.army.swords+g.army.archers<10)return log('Send at least 10 land troops to explore.');g.army.spears=Math.max(0,g.army.spears-3);g.explored++;g.relic+=Math.random()<.45?2:1;log('Explorers returned with ancient relics. The map has changed.');render()}
function dungeon(){if(g.army.spears+g.army.swords+g.army.archers<15)return log('At least 15 troops are needed for the Deep Ruins.');g.army.spears=Math.max(0,g.army.spears-5);g.relic+=4;g.food+=180;g.wood+=120;g.stone+=120;log('Deep Ruins cleared. You recovered relics and resources.');render()}
function assault(){if(g.army.swords+g.army.archers+g.army.raiders<25)return log('You need 25 advanced troops to assault the fortress.');if(g.relic<8)return log('You need 8 relics to reveal the fortress weakness.');g.relic-=8;g.discoveries++;log('FORTRESS BREACHED! A new region has been revealed.');}
function showTab(x,b){tab=x;document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));b.classList.add('active');render()}
function render(){
let r=rates();document.getElementById('food').textContent=n(g.food);document.getElementById('wood').textContent=n(g.wood);document.getElementById('stone').textContent=n(g.stone);document.getElementById('relic').textContent=n(g.relic);document.getElementById('foodRate').textContent=r.food.toFixed(1);document.getElementById('woodRate').textContent=r.wood.toFixed(1);document.getElementById('stoneRate').textContent=r.stone.toFixed(1);
let c=document.getElementById('content');
if(tab==='city') c.innerHTML=`<h2>Your Settlement</h2><div class="panelgrid">${Object.keys(g.build).map(k=>{let cc=cost(k,g.build[k]);return `<div class="row"><div><b>${name(k)}</b><br><small>Level ${g.build[k]} • ${n(cc.food)} food / ${n(cc.wood)} wood / ${n(cc.stone)} stone</small></div><button onclick="upgrade('${k}')">Upgrade</button></div>`}).join('')}</div><p class="sub">The town grows continuously. Higher levels become progressively more expensive.</p>`;
if(tab==='research') c.innerHTML=`<h2>Research</h2>${[['logistics','Logistics','Faster construction and economy'],['steel','Steelcraft','Unlock Swordsmen and stronger defenses'],['seafaring','Seafaring','Unlock naval expansion']].map(a=>`<div class="row" style="margin-bottom:9px"><div><b>${a[1]}</b><br><small>${a[2]} • Level ${g.research[a[0]]}/3</small></div><button onclick="research('${a[0]}')">Research</button></div>`).join('')}`;
if(tab==='army') c.innerHTML=`<h2>Military</h2>${[['spears','Spearmen'],['swords','Swordsmen'],['archers','Archers'],['raiders','Sea Raiders'],['ships','Warship']].map(a=>`<div class="row" style="margin-bottom:9px"><div><b>${a[1]}</b><br><small>Owned: ${g.army[a[0]]}</small></div><button onclick="train('${a[0]}')">Train</button></div>`).join('')}<p class="sub">Prototype rule: every god/civilization will eventually have its own strategic identity, but this first build uses one shared army.</p>`;
if(tab==='explore') c.innerHTML=`<h2>Explore the Shattered Sea</h2><div class="row"><div><b>Chart the unknown</b><br><small>Send scouts to reveal ruins and recover relics. Explorations permanently increase the world chronicle.</small></div><button onclick="explore()">Explore</button></div><div class="row" style="margin-top:9px"><div><b>Deep Ruins</b><br><small>Short PvE mission. Risk troops for resources and relics.</small></div><button onclick="dungeon()">Enter</button></div><div class="row" style="margin-top:9px"><div><b>Neutral Fortress</b><br><small>A major objective. Requires advanced troops and relics.</small></div><button onclick="assault()">Assault</button></div><p class="sub">The eventual full game will make exploration and conquest alter the shared world map.</p>`;
}
function log(s){let el=document.getElementById('log');el.innerHTML+=`<div>• ${s}</div>`;el.scrollTop=el.scrollHeight;saveGame()}
function tick(){let now=Date.now(), mins=(now-last)/60000;last=now;let r=rates();g.food=Math.min(999999,g.food+r.food*mins);g.wood=Math.min(999999,g.wood+r.wood*mins);g.stone=Math.min(999999,g.stone+r.stone*mins);render()}
render();log('A new world has begun. Your settlement stands on the edge of the Shattered Sea.');setInterval(tick,1000);
</script>
</body></html>
